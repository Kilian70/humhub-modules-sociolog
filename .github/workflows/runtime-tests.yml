name: HumHub runtime tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

jobs:
  stable:
    name: HumHub Stable
    uses: humhub/module-coding-standards/.github/workflows/codeception-master.yml@main
    with:
      module-id: sociolog

  develop:
    name: HumHub Develop
    uses: humhub/module-coding-standards/.github/workflows/codeception-develop.yml@main
    with:
      module-id: sociolog

name: HumHub runtime tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

jobs:
  stable:
    name: HumHub Stable
    uses: humhub/module-coding-standards/.github/workflows/codeception-master.yml@main
    with:
      module-id: sociolog

  release-1194:
    name: HumHub 1.19.4
    uses: ./.github/workflows/codeception-base.yml
    with:
      module-id: sociolog
      # Official v1.19.4 release commit; keep Stable and Develop separate.
      humhub-branch: b8881d5ea7ee27384a33adeaa23100c73472c4ce
      php: '["8.2", "8.3", "8.4"]'

  develop:
    name: HumHub Develop
    uses: ./.github/workflows/codeception-develop.yml
    with:
      module-id: sociolog
